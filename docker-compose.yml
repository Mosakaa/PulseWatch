services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulsewatch
      POSTGRES_USER: pulsewatch
      POSTGRES_PASSWORD: pulsewatch
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsewatch -d pulsewatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://pulsewatch:pulsewatch@database:5432/pulsewatch
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres-data:
